[project]
name = "khutbah"
version = "0.1.0"
description = "Find Qur'an quotations in khutbah transcripts, and replace what speech recognition garbled with the exact text."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["khutbah/**/*.py", "khutbah/data/*.txt"]
